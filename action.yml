name: Build Loreweave
description: Build pinned Loreweave assets for another private CARI-DAAL repository.
outputs:
  assets:
    description: Absolute directory containing the compiled release assets.
    value: ${{ steps.build.outputs.assets }}
runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        LOREWEAVE_ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$LOREWEAVE_ACTION_PATH"
        npm ci --no-audit --no-fund
        npm run build
        printf 'assets=%s/dist\n' "$LOREWEAVE_ACTION_PATH" >> "$GITHUB_OUTPUT"
