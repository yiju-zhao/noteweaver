name: Build Noteweaver
description: Build pinned Noteweaver release assets for a consuming repository.
outputs:
  assets:
    description: Absolute directory containing the compiled release assets.
    value: ${{ steps.build.outputs.assets }}
runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        NOTEWEAVER_ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$NOTEWEAVER_ACTION_PATH"
        npm ci --no-audit --no-fund
        npm run build
        printf 'assets=%s/dist\n' "$NOTEWEAVER_ACTION_PATH" >> "$GITHUB_OUTPUT"
