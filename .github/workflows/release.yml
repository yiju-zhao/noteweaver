name: Release
on:
  push:
    tags: ["*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check version
        run: node -e 'const m=require("./manifest.json"); if(m.version!==process.env.GITHUB_REF_NAME || m.version!==require("./package.json").version) process.exit(1)'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:cli
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/noteweaver-arxiv/tests
      - name: Checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - run: node scripts/release-lock.mjs
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css dist/validation.cjs dist/runtime.zip dist/agent-plugin.zip dist/installer.py dist/tools.lock.json dist/SHA256SUMS THIRD_PARTY_NOTICES.md LICENSE --draft --verify-tag --generate-notes
