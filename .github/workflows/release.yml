name: Release
on:
  push:
    tags: ["*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check version
        run: node -e 'const m=require("./manifest.json"); if(m.version!==process.env.GITHUB_REF_NAME || m.version!==require("./package.json").version) process.exit(1)'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Checksums
        working-directory: dist
        run: sha256sum main.js manifest.json styles.css validation.cjs > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css dist/validation.cjs dist/SHA256SUMS LICENSE THIRD_PARTY_NOTICES.md --draft --verify-tag --generate-notes
