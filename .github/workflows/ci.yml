name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:cli
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/noteweaver-arxiv/tests
